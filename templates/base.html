<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VidSnapAI{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="vs-navbar navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand vs-brand" href="/">
                <i class="fas fa-bolt vs-brand-icon"></i> VidSnapAI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link vs-nav-link" href="/"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link vs-nav-link" href="/studio"><i class="fas fa-wand-magic-sparkles"></i> Snap Studio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link vs-nav-link" href="/snaps"><i class="fas fa-images"></i> My Snaps</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="vs-main-content">
        {% block content %}{% endblock %}
    </div>

    <footer class="vs-footer">
        <div class="container">
            <div class="vs-footer-content">
                <div class="vs-footer-brand">
                    <i class="fas fa-bolt"></i> VidSnapAI
                    <span class="vs-footer-tagline">AI-Powered Video Snaps</span>
                </div>
                <div class="vs-copyright">
                    &copy; 2026 VidSnapAI. All rights reserved.
                </div>
                <div class="vs-social-links">
                    <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                    <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
